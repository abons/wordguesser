<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#121213;
    font-family:"Segoe UI",system-ui,sans-serif;
    position:relative;
  }
  .left { position:absolute; left:80px; top:78px; width:700px; }
  h1 {
    font-family:"Segoe UI Black","Arial Black","Segoe UI",sans-serif;
    font-weight:900; font-size:96px; line-height:1.0; color:#fff;
    letter-spacing:-2px;
  }
  .tag {
    margin-top:36px; font-size:34px; line-height:1.38; color:#c9cbcf;
    font-weight:400; max-width:620px;
  }
  .pills { margin-top:36px; display:flex; flex-wrap:wrap; gap:14px; max-width:672px; }
  .pill {
    background:#1e1f20; border-radius:999px; padding:13px 23px;
    font-size:24px; color:#e6e7e9; font-weight:600; white-space:nowrap;
  }
  .url {
    position:absolute; left:80px; top:556px;
    font-family:Consolas,"Courier New",monospace; font-weight:700;
    font-size:29px; color:#4ade80;
  }
  .board { position:absolute; left:776px; top:200px; }
  .row { display:flex; gap:20px; margin-bottom:20px; }
  .t {
    width:104px; height:104px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Segoe UI",sans-serif; font-weight:700; font-size:52px; color:#fff;
  }
  .grey { background:#3a3a3c; }
  .yellow { background:#d3a625; }
  .green { background:#22a94e; }
</style></head>
<body>
  <div class="left">
    <h1>Word Guesser</h1>
    <p class="tag">A tiny, native word-guessing game for Android
      &mdash; 17 languages, daily puzzles, ~101&nbsp;KB.</p>
    <div class="pills">
      <span class="pill">🟩 No ads</span>
      <span class="pill">📊 Offline play</span>
      <span class="pill">🤖 Android 5.0+</span>
      <span class="pill">🟢 F-Droid</span>
    </div>
  </div>
  <div class="url">abons.github.io/wordguesser</div>
  <div class="board">
    <div class="row">
      <div class="t grey">G</div><div class="t yellow">U</div>
      <div class="t green">E</div><div class="t grey">S</div>
    </div>
    <div class="row">
      <div class="t green">W</div><div class="t grey">O</div>
      <div class="t green">R</div><div class="t yellow">D</div>
    </div>
  </div>
</body></html>
